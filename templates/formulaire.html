<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Inscription Tournoi de Foot - Yaoundé</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; background: #f4f4f4; }
    .container { background: white; padding: 20px; border-radius: 8px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { background: #28a745; color: white; padding: 12px; border: none; cursor: pointer; width: 100%; }
        label { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tournoi de Foot Inter-Quartiers 2026</h1>
        <form action="/inscrire" method="post">
            <label>Nom de l'équipe *</label><input type="text" name="nom_equipe" required>
            <label>Nom du capitaine *</label><input type="text" name="capitaine" required>
            <label>Téléphone *</label><input type="tel" name="telephone" required>
            <label>Email *</label><input type="email" name="email" required>
            <label>Quartier</label>
            <select name="quartier">
                <option value="">Choisir</option><option>Bastos</option><option>Melen</option><option>Mvog-Ada</option><option>Essos</option>
            </select>
            <label>Nombre de joueurs</label><input type="number" name="nb_joueurs" min="7" max="15" value="11">
            <button type="submit">Inscrire mon équipe</button>
        </form>
    </div>
</body>
</html>
